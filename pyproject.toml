[project]
name = "haunt"
version = "0.1.0"
description = "A haunted terminal powered by a local open-weight model"
requires-python = ">=3.9"
dependencies = ["torch", "transformers>=4.50"]

[project.scripts]
haunt = "haunt.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["haunt"]
